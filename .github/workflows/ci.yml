name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A CI run takes precedence over a concurrent release run of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Test
        run: go test ./...

      - name: Test (integration, skipped when not configured)
        run: go test -tags=integration ./...

      - name: Build
        run: go build -o dist/xo ./cmd/xo
